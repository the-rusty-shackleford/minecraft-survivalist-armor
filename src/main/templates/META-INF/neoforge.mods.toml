modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/the-rusty-shackleford/minecraft-survivalist-armor/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Rusty Shackleford, nfx"
description='''
Craftable cosmetic armour kits. Apply a kit to any armour piece at the smithing table, as you would
a trim, and the piece is drawn as a remodelled scavenger's version of itself: straps, plates,
pouches and respirators. Its stats, name and enchantments never change, and a trim still shows.
'''

[[mixins]]
    config="survivalistarmor.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
